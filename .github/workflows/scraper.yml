name: Scrape Newspaper Front Pages

on:
  schedule:
    # Runs hourly (at minute 0)
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Scraper and Data Generator
        run: python generate_data.py

      - name: Commit and Push Changes (If New Papers Found)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          
          # Check if there are uncommitted changes in docs/
          if [ -n "$(git status --porcelain docs/)" ]; then
            echo "[+] New newspaper covers or data detected. Committing changes..."
            git commit -m "Automated update: Add new newspaper front pages ($(date -u +'%Y-%m-%dT%H:%M:%SZ'))"
            git push
          else
            echo "[*] No new paper covers found. Skipping commit."
          fi